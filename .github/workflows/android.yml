name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button, for a fresh release bundle without a code change

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (SMS parser, analytics)
        run: ./gradlew -p core test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify the APK requests no network permission
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)" permissions.txt; then
            echo "::error::The APK requests a network permission. The app must stay offline."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Play Store upload file. Signed when these repository secrets are set:
      # KHARCHA_KEYSTORE_BASE64 (base64 of the upload .jks), KHARCHA_KEYSTORE_PASSWORD,
      # KHARCHA_KEY_ALIAS, KHARCHA_KEY_PASSWORD.
      - name: Build release bundle (.aab)
        env:
          KHARCHA_KEYSTORE_BASE64: ${{ secrets.KHARCHA_KEYSTORE_BASE64 }}
          KHARCHA_KEYSTORE_PASSWORD: ${{ secrets.KHARCHA_KEYSTORE_PASSWORD }}
          KHARCHA_KEY_ALIAS: ${{ secrets.KHARCHA_KEY_ALIAS }}
          KHARCHA_KEY_PASSWORD: ${{ secrets.KHARCHA_KEY_PASSWORD }}
          KHARCHA_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KHARCHA_KEYSTORE_BASE64" ]; then
            printf '%s' "$KHARCHA_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KHARCHA_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            # Diagnostics (no secrets printed): compare size and SHA-256 with your local upload.jks,
            # e.g. `ls -l upload.jks` and `shasum -a 256 upload.jks`.
            echo "Keystore from secret: $(stat -c %s "$KHARCHA_KEYSTORE_FILE") bytes, SHA-256 $(sha256sum "$KHARCHA_KEYSTORE_FILE" | cut -d' ' -f1)"
            STOREPASS="$(printf '%s' "$KHARCHA_KEYSTORE_PASSWORD" | tr -d '\r\n')"
            if keytool -list -keystore "$KHARCHA_KEYSTORE_FILE" -storepass "$STOREPASS" > "$RUNNER_TEMP/keytool.txt" 2>&1; then
              echo "Keystore password opens the keystore."
              # If the alias secret doesn't name a key here but the keystore holds exactly one key,
              # sign with that key (a mistyped alias secret is easy to make and hard to see).
              ALIAS="$(printf '%s' "$KHARCHA_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]"'"'"']*//; s/[[:space:]"'"'"']*$//')"
              KEYS="$(grep -i "PrivateKeyEntry" "$RUNNER_TEMP/keytool.txt" | cut -d, -f1)"
              if ! printf '%s\n' "$KEYS" | grep -qixF -- "$ALIAS"; then
                if [ "$(printf '%s\n' "$KEYS" | grep -c .)" = "1" ]; then
                  echo "::warning::KHARCHA_KEY_ALIAS doesn't match the key in the keystore; using the keystore's only key, '$KEYS'. Update the secret to that name."
                  ALIAS="$KEYS"
                else
                  echo "::error::KHARCHA_KEY_ALIAS doesn't match any key. Keys in this keystore: $(printf '%s' "$KEYS" | tr '\n' ' ')"
                fi
              fi
              export KHARCHA_KEY_ALIAS="$ALIAS"
              # PKCS12 keystores (the default today) use the keystore password for the key as well.
              if grep -qi "keystore type: PKCS12" "$RUNNER_TEMP/keytool.txt"; then
                export KHARCHA_KEY_PASSWORD="$STOREPASS"
              fi
            else
              echo "::error::KHARCHA_KEYSTORE_PASSWORD doesn't open this keystore, or KHARCHA_KEYSTORE_BASE64 isn't a complete copy of it."
              grep -vi "password" "$RUNNER_TEMP/keytool.txt" | head -5 || true
            fi
            rm -f "$RUNNER_TEMP/keytool.txt"
          else
            echo "::warning::Keystore secrets are not set, so the release bundle is unsigned and can't be uploaded to Play."
          fi
          ./gradlew :app:bundleRelease --console=plain
          rm -f "$RUNNER_TEMP/upload.jks"
          if [ -n "$KHARCHA_KEYSTORE_BASE64" ]; then
            # Fail loudly if the secrets were set but the bundle still isn't signed.
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee verify.txt
            grep -q "jar verified" verify.txt || { echo "::error::app-release.aab is not signed"; exit 1; }
            echo "Signed release bundle, versionCode $KHARCHA_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
